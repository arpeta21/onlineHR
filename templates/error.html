<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="{{ url_for('static', filename='img/favicon.ico') }}"
    />
    <title>{{ code }} — Sanvit HR</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card" style="text-align: center">
        <div class="auth-mark" style="justify-content: center">
          <span class="brand-blue-dot"></span>
          <div style="text-align: left">
            <span class="word">Sanvit HR</span>
            <div class="auth-mark-sub">HRMS Portal</div>
          </div>
        </div>
        <h1 style="font-size: 48px; margin: 18px 0 6px">{{ code }}</h1>
        <p class="auth-sub" style="margin-bottom: 24px">{{ message }}</p>
        <a href="/" class="btn btn-outline">Back to dashboard</a>
      </div>
    </div>
  </body>
</html>
