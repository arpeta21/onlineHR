<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <title>Sign in — SaarthiEV Mobility HRMS Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-mark auth-mark-logo">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SaarthiEV Mobility" class="auth-logo-img">
        <div>
          <span class="word">SaarthiEV Mobility Pvt Ltd</span>
          <div class="auth-mark-sub">HRMS Portal</div>
        </div>
      </div>
      <p class="auth-sub">Sign in with the employee ID and password issued by your administrator.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="field">
          <label for="employee_code">Employee ID</label>
          <input type="text" id="employee_code" name="employee_code" placeholder="e.g. EMP1001" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
