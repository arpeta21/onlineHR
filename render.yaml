databases:
  - name: sanvit-db
    plan: basic-256mb
    region: singapore

services:
  - type: keyvalue
    name: sanvit-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: sanvit-hr
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload -w 2 --timeout 60 app:app
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: sanvit-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: sanvit-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: APP_ENV
        value: production

    # The free plan has ephemeral storage. Use a paid persistent disk or
    # object storage before storing real employee documents or CVs.
